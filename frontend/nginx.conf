server {
    listen 80;
    root /usr/share/nginx/html;

    # Build assets carry a content hash in their name: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/productos/..., /admin/...) all get the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
