worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;

    # Docker DNS: upstreams re-resolve without a restart (`--scale products=N`).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inbound X-Request-ID is echoed in logs and bodies: keep it only if short and safe.
    map $http_x_request_id $request_id_final {
        default                  $request_id;
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    }

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id_final",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"upstream_addr":"$upstream_addr",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json;

    # Per-IP limits: api for browsing, media for image-heavy listings, auth (10/min) against brute force.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=media_zone:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_status 429;

    upstream auth_upstream {
        zone auth_zone_upstream 64k;
        server auth:8000 resolve;
        keepalive 16;
    }

    upstream frontend_upstream {
        zone frontend_zone_upstream 64k;
        server frontend:80 resolve;
        keepalive 16;
    }

    upstream products_upstream {
        zone products_zone 64k;
        server products:8000 resolve;
        keepalive 16;
    }

    upstream cart_upstream {
        zone cart_zone 64k;
        server cart:8000 resolve;
        keepalive 16;
    }

    upstream orders_upstream {
        zone orders_zone 64k;
        server orders:8000 resolve;
        keepalive 16;
    }

    upstream minio_upstream {
        zone minio_zone 64k;
        server minio:9000 resolve;
        keepalive 8;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps the client's port, so services build correct absolute URLs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_final;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        limit_req zone=api_zone burst=20 nodelay;

        error_page 413 = @payload_too_large;
        error_page 429 = @too_many_requests;
        error_page 502 503 504 = @service_unavailable;

        location = /health {
            add_header X-Request-ID $request_id_final always;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # proxy_pass without URI: the path is forwarded as-is; each service owns its /api/v1 routing.

        # Credential endpoints get the strict per-minute limit (regex beats prefix).
        location ~ ^/api/v1/auth/(login|register|refresh)/?$ {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://auth_upstream;
        }

        location /api/v1/auth/ {
            proxy_pass http://auth_upstream;
        }

        # Django enforces the real 5 MB limit with a clear 400; 6m leaves room for multipart overhead.
        location ~ ^/api/v1/products/[0-9a-fA-F-]+/images/?$ {
            client_max_body_size 6m;
            proxy_pass http://products_upstream;
        }

        location /api/v1/products {
            proxy_pass http://products_upstream;
        }

        location /api/v1/categories {
            proxy_pass http://products_upstream;
        }

        location /api/v1/cart {
            proxy_pass http://cart_upstream;
        }

        location /api/v1/orders {
            proxy_pass http://orders_upstream;
        }

        location ~ ^/api/v1/(docs|schema)/auth/$ {
            proxy_pass http://auth_upstream;
        }

        location ~ ^/api/v1/(docs|schema)/products/$ {
            proxy_pass http://products_upstream;
        }

        location ~ ^/api/v1/(docs|schema)/cart/$ {
            proxy_pass http://cart_upstream;
        }

        location ~ ^/api/v1/(docs|schema)/orders/$ {
            proxy_pass http://orders_upstream;
        }

        location /media/ {
            limit_req zone=media_zone burst=200 nodelay;
            limit_except GET HEAD { deny all; }

            # Trailing slash strips /media/: /media/<bucket>/<key> -> /<bucket>/<key>.
            proxy_pass http://minio_upstream/;
            # Any proxy_set_header here drops ALL server-level ones: re-declare what is needed.
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";
            proxy_set_header X-Request-ID $request_id_final;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header Cache-Control;

            # Keys are random UUIDs that are never overwritten: safe to cache forever.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Request-ID $request_id_final always;

            # Everything looks like a 404, never MinIO's XML errors (error_page here drops the server-level ones).
            proxy_intercept_errors on;
            error_page 403 404 = @not_found;
            error_page 429 = @too_many_requests;
            error_page 500 502 503 504 = @service_unavailable;
        }

        # Unknown API paths keep answering with the JSON envelope, never with the app.
        location /api/ {
            return 404;
        }

        # Everything else is the React app (its own nginx falls back to index.html).
        location / {
            limit_req zone=media_zone burst=200 nodelay;
            proxy_pass http://frontend_upstream;
        }

        error_page 404 = @not_found;

        location @not_found {
            add_header X-Request-ID $request_id_final always;
            default_type application/json;
            return 404 '{"success":false,"data":null,"error":{"code":"not_found","message":"Resource not found.","details":null},"meta":{"request_id":"$request_id_final"}}';
        }

        location @payload_too_large {
            add_header X-Request-ID $request_id_final always;
            default_type application/json;
            return 413 '{"success":false,"data":null,"error":{"code":"payload_too_large","message":"Request body exceeds the allowed size.","details":null},"meta":{"request_id":"$request_id_final"}}';
        }

        location @too_many_requests {
            add_header X-Request-ID $request_id_final always;
            add_header Retry-After 1 always;
            default_type application/json;
            return 429 '{"success":false,"data":null,"error":{"code":"too_many_requests","message":"Too many requests. Please slow down.","details":null},"meta":{"request_id":"$request_id_final"}}';
        }

        location @service_unavailable {
            add_header X-Request-ID $request_id_final always;
            add_header Retry-After 5 always;
            default_type application/json;
            return 503 '{"success":false,"data":null,"error":{"code":"service_unavailable","message":"The service is temporarily unavailable. Please try again.","details":null},"meta":{"request_id":"$request_id_final"}}';
        }
    }
}
